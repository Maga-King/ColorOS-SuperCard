name: 构建与本地产物核对

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配置与本地一致的 JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.9+10'
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: 配置 Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw '运行器没有 Android SDK' }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK 安装失败' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 载入官方构建签名
        if: github.event_name != 'pull_request' && github.repository == 'Maga-King/ColorOS-SuperCard'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.SUPERCARD_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw '缺少签名 Secret' }
          $target = Join-Path $env:USERPROFILE '.android/debug.keystore'
          New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: 编译、合包、核对所有 APK 内容
        shell: pwsh
        run: ./ci/build.ps1
      - name: 核对官方签名证书
        if: github.event_name != 'pull_request' && github.repository == 'Maga-King/ColorOS-SuperCard'
        shell: pwsh
        run: |
          $actual = (Get-Content -Raw dist/resource-verification.json | ConvertFrom-Json).signingCertificateSha256
          $expected = (Get-Content -Raw ci/signing-certificate.sha256).Trim()
          if ($actual -ne $expected) { throw '签名证书与本地基准不一致' }
      - name: 上传已核对产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supercard-unified
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: 清理签名临时文件
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path $env:USERPROFILE '.android/debug.keystore'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }
